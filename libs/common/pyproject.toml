[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refcommon"
version = "0.1.0"
description = "Shared identity, FHIR-subset and exchange-contract utilities for the referral platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
include = ["refcommon*"]
