server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  # Re-resolve service names via Docker's DNS so recreated containers (new IPs) are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $central_api  http://central:8000;
  set $drali_api    http://drali:8000;
  set $chughtai_api http://chughtai:8000;
  set $ziauddin_api http://ziauddin:8000;
  set $akuh_api     http://akuh:8000;
  proxy_set_header Host $host;
  proxy_read_timeout 120s;

  location /api/central/  { rewrite ^/api/central/(.*)$ /$1 break;  proxy_pass $central_api; }
  # Each institution's own system (its staff use it directly; the browser sends the user's token)
  location /api/drali/    { rewrite ^/api/drali/(.*)$ /$1 break;    proxy_pass $drali_api; }
  location /api/chughtai/ { rewrite ^/api/chughtai/(.*)$ /$1 break; proxy_pass $chughtai_api; }
  location /api/ziauddin/ { rewrite ^/api/ziauddin/(.*)$ /$1 break; proxy_pass $ziauddin_api; }
  location /api/akuh/     { rewrite ^/api/akuh/(.*)$ /$1 break;     proxy_pass $akuh_api; }

  location / {
    try_files $uri /index.html;
  }
}
