server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  location /api/central/  { proxy_pass http://central:8000/;    proxy_set_header Host $host; proxy_read_timeout 120s; }
  location /api/clinic/   { proxy_pass http://clinic:8000/;     proxy_set_header Host $host; }
  location /api/lab/      { proxy_pass http://lab:8000/;        proxy_set_header Host $host; }
  location /api/specialist/ { proxy_pass http://specialist:8000/; proxy_set_header Host $host; }

  location / {
    try_files $uri /index.html;
  }
}
