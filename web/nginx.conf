server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  # Re-resolve service names via Docker's DNS so recreated containers (new IPs) are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $central_api    http://central:8000;
  set $clinic_api     http://clinic:8000;
  set $lab_api        http://lab:8000;
  set $specialist_api http://specialist:8000;
  proxy_set_header Host $host;
  proxy_read_timeout 120s;

  location /api/central/    { rewrite ^/api/central/(.*)$ /$1 break;    proxy_pass $central_api; }
  location /api/clinic/     { rewrite ^/api/clinic/(.*)$ /$1 break;     proxy_pass $clinic_api; }
  location /api/lab/        { rewrite ^/api/lab/(.*)$ /$1 break;        proxy_pass $lab_api; }
  location /api/specialist/ { rewrite ^/api/specialist/(.*)$ /$1 break; proxy_pass $specialist_api; }

  location / {
    try_files $uri /index.html;
  }
}
